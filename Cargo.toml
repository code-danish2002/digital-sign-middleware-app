[package]
name = "pdf_signer_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = { version = "0.23.0", features = ["rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
pkcs11 = "0.5.0"
x509-parser = "0.16.0"
hex = "0.4"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
pdf-writer = "0.10"
yasna = "0.5" # For ASN.1 encoding of the PKCS#7 signature
lopdf = "0.33"
chrono = {version = "0.4", features = ["clock"] }
num-bigint = "0.4"
winapi = { version = "0.3", features = ["wincrypt", "winbase", "minwindef", "ntdef"] }